{{ define "main" }}
<div class="container py-5">
  <div class="row">
    <div class="col-lg-8 mb-5 mb-lg-0">
      <div class="taxonomy-terms-wrapper bg-white p-4 p-md-5 rounded shadow-sm">
        <h2 class="font-weight-bold mb-4">All {{ .Title }}</h2>
        <div class="d-flex flex-wrap gap-2 terms-list">
          {{ range .Data.Terms.Alphabetical }}
            <a href="{{ .Page.RelPermalink }}" class="badge badge-tag p-2 mr-2 mb-2 font-weight-normal font-size-md">
              {{ .Page.Title }} <span class="badge badge-light-custom ml-1">{{ .Count }}</span>
            </a>
          {{ end }}
        </div>
      </div>
    </div>
    <div class="col-lg-4">
      {{ partial "sidebar.html" . }}
    </div>
  </div>
</div>
{{ end }}
